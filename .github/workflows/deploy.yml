name: Production Deploy (Approval Required)

on:
  workflow_dispatch:
    inputs:
      release:
        description: Verified web release version
        required: true
        type: string
      approval:
        description: Type OPERATIONS_APPROVED after the owner's explicit release decision
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  production-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit production approval
        env:
          APPROVAL: ${{ inputs.approval }}
        run: test "$APPROVAL" = "OPERATIONS_APPROVED"

  remote-preflight:
    needs: production-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - run: npm ci

      - name: Require production verification secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_PROJECT_ID"

      - name: Apply safe migrations and verify cross-device sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
          npm run release:migrations -- --apply
          npm run release:sync

  android-preflight:
    needs: production-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build native web bundle and sync Android
        run: npm run android:sync

      - name: Create temporary Android test signing key
        shell: bash
        run: |
          set -euo pipefail
          ci_store_password="$(openssl rand -hex 24)"
          keytool -genkeypair \
            -keystore android/app/jobhigh-ci-test.jks \
            -storepass "$ci_store_password" \
            -keypass "$ci_store_password" \
            -alias jobhigh-ci-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=JOBgo CI Test, OU=Automated Verification, O=gyo6.kr, C=KR"
          {
            echo "storeFile=jobhigh-ci-test.jks"
            echo "storePassword=$ci_store_password"
            echo "keyAlias=jobhigh-ci-test"
            echo "keyPassword=$ci_store_password"
          } > android/keystore.properties

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Android install, exit, and recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: npm run release:android -- --skip-web-build

  build:
    needs: [remote-preflight, android-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Verify production role flows
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLIC_TRIAL_READ_ONLY: "true"
        run: npm run verify:production-flows

      - name: Verify public trial broker and RLS isolation
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run verify:public-trial && npm run verify:rls-isolation

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
