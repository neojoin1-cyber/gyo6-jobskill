name: Production Deploy (Approval Required)

on:
  workflow_dispatch:
    inputs:
      release:
        description: Verified web release version
        required: true
        type: string
      approval:
        description: Type OPERATIONS_APPROVED after the owner's explicit release decision
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  production-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit production approval
        env:
          APPROVAL: ${{ inputs.approval }}
        run: test "$APPROVAL" = "OPERATIONS_APPROVED"

  remote-preflight:
    needs: production-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - run: npm ci

      - name: Require production verification secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_PROJECT_ID"

      - name: Apply safe migrations and verify cross-device sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p supabase/.temp
          printf '%s' "$SUPABASE_PROJECT_ID" > supabase/.temp/project-ref
          npm run release:migrations -- --apply
          npm run release:sync

  android-preflight:
    needs: production-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build native web bundle and sync Android
        run: npm run android:sync

      - name: Verify Android install, exit, and recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          script: npm run release:android -- --skip-web-build

  build:
    needs: [remote-preflight, android-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Verify production role flows
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PUBLIC_TRIAL_READ_ONLY: "true"
        run: npm run verify:production-flows

      - name: Verify public trial broker and RLS isolation
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run verify:public-trial && npm run verify:rls-isolation

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
